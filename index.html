<!DOCTYPE html>
<!-- class="locked": Bis zur Anmeldung ist nur die Anmeldeseite (#gate) zu sehen (siehe "Anmeldesperre" in style.css und app.js). -->
<html lang="de" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bier Sammler">
  <meta name="description" content="Sammle jedes Bier als Karte, entdecke seltene Funde und steige im Level auf.">
  <title>Bier Sammler</title>
  <!-- Darstellung (System/hell/dunkel) vor dem ersten Zeichnen setzen, damit nichts aufblitzt -->
  <script>try { var t = localStorage.getItem('biersammler-theme-v1'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <!-- Schnellere Anmeldung: Der Browser lädt die Firebase-Module schon, während die übrigen Dateien noch kommen.
       Die Versionsnummer muss zu FIREBASE_SDK in js/store.js und sw.js passen (sonst wird doppelt geladen und ohne Netz fehlt das SDK). -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
</head>
<body>
  <!-- Farbverlauf für die Flasche der Spezialkarte „Regenbogen“ (fill: url(#rb-grad) in css/style.css); muss im Dokument stehen, nicht display:none -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="rb-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF5FB0"/><stop offset="0.25" stop-color="#FFB02E"/><stop offset="0.5" stop-color="#4FD98B"/><stop offset="0.75" stop-color="#38B6FF"/><stop offset="1" stop-color="#8C6BFF"/></linearGradient></defs></svg>
  <div id="gate" class="gate"></div>

  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <h1>Bier Sammler</h1>
        <p id="who" class="who">Anonym</p>
      </div>
      <div id="level" class="level" role="img" aria-label="Level 1, 0,0 von 10 Punkten"></div>
    </div>
    <div class="wrap tools">
      <button class="btn" type="button" data-act="stats">Statistiken</button>
      <button class="btn" type="button" data-act="ranking" hidden>Platzierung</button>
      <!-- INFO-FENSTER: Knopf „Bierwissen“ -->
      <button class="icon-btn info-btn" type="button" data-act="info" aria-label="Bierwissen: Sorten und Geschmack erklärt" title="Bierwissen">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.6M12 7.7h.01"/></svg>
      </button>
      <span id="sync" class="sync" role="status" aria-live="polite"></span>
      <button class="icon-btn" type="button" data-act="settings" aria-label="Einstellungen" title="Einstellungen">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.6h3.4l.5 2.7 1.9.8 2.3-1.6 2.4 2.4-1.6 2.3.8 1.9 2.7.5v3.4l-2.7.5-.8 1.9 1.6 2.3-2.4 2.4-2.3-1.6-1.9.8-.5 2.7h-3.4l-.5-2.7-1.9-.8-2.3 1.6-2.4-2.4 1.6-2.3-.8-1.9-2.7-.5v-3.4l2.7-.5.8-1.9-1.6-2.3 2.4-2.4 2.3 1.6 1.9-.8z"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap"></main>

  <button id="fab" class="fab" type="button" data-act="add" aria-label="Bier hinzufügen" title="Bier hinzufügen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="add" class="sheet" aria-label="Bier hinzufügen"></dialog>
  <dialog id="card" class="sheet" aria-label="Kartenansicht"></dialog>
  <dialog id="stats" class="sheet" aria-label="Statistiken"></dialog>
  <dialog id="ranking" class="sheet" aria-label="Platzierung"></dialog>
  <dialog id="karte" class="sheet" aria-label="Karte der Orte"></dialog><!-- STANDORT-KARTE -->
  <dialog id="info" class="sheet" aria-label="Bierwissen"></dialog><!-- INFO-FENSTER -->
  <dialog id="settings" class="sheet" aria-label="Einstellungen"></dialog>
  <dialog id="confirm" class="sheet small" aria-label="Bestätigen"></dialog>
  <dialog id="age" class="sheet small" aria-label="Hinweis zum Alter"></dialog>
  <dialog id="welcome" class="sheet" aria-label="Willkommen und wichtigste Regeln"></dialog>
  <div id="toast" class="toast" popover="manual" role="status" aria-live="polite" hidden></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/game.js"></script>
  <script src="js/store.js"></script>
  <script src="js/karte.js"></script><!-- STANDORT-KARTE -->
  <script src="js/info.js"></script><!-- INFO-FENSTER -->
  <script src="js/app.js"></script>
</body>
</html>
